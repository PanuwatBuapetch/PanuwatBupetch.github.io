name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        # เพิ่มการเปลี่ยนโฟลเดอร์เข้าไปยัง /portfolio
        run: |
          cd portfolio
          npm install
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # บอกให้มันไปเอาไฟล์ที่ Build เสร็จแล้วจากโฟลเดอร์ portfolio/dist
          publish_dir: ./portfolio/dist